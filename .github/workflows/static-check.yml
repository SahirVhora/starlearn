name: Static Check

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Verify static app files
        run: |
          test -f index.html
          test -f app.js
          test -f README.md

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check questions.js
          node --check questions-11plus.js
          node --check sw.js

      - name: Test application behaviour and question data
        run: node --test tests/*.test.js
